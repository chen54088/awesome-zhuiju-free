name: Deploy Worker

on:
  push:
    branches: [hub]
    paths:
      - "cf-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify /ping
        run: |
          url="https://zhuiju-hub.atbx5r7k23g.workers.dev/ping"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/ping.json -w '%{http_code}' "$url" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then cat /tmp/ping.json; exit 0; fi
            sleep 10
          done
          echo "::warning::ping failed; the runner could not reach workers.dev"
